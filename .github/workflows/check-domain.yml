name: check-domain
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure docs.opencli.ai points at the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }

          echo "--- zones the token can see"
          api "https://api.cloudflare.com/client/v4/zones?name=opencli.ai" > /tmp/z.json
          python3 - <<'PY'
          import json
          z = json.load(open("/tmp/z.json"))
          print("success:", z.get("success"))
          for e in z.get("errors", []):
              print("error:", e.get("code"), e.get("message"))
          for r in z.get("result") or []:
              print("zone:", r["name"], r["id"])
              open("/tmp/zoneid", "w").write(r["id"])
          PY

          if [ ! -s /tmp/zoneid ]; then
            echo "The token cannot see the zone; a DNS record cannot be created with it."
            exit 0
          fi
          zone=$(cat /tmp/zoneid)

          echo "--- existing docs record"
          api "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=docs.opencli.ai" > /tmp/rec.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/rec.json"))
          found = [(x["type"], x["content"]) for x in (r.get("result") or [])]
          print("found:", found or "none")
          open("/tmp/has", "w").write("yes" if found else "")
          PY

          if [ ! -s /tmp/has ]; then
            echo "--- creating CNAME docs -> opencli-docs.pages.dev"
            api -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" \
              --data '{"type":"CNAME","name":"docs","content":"opencli-docs.pages.dev","proxied":true}' > /tmp/new.json
            python3 - <<'PY'
          import json
          r = json.load(open("/tmp/new.json"))
          print("created:", r.get("success"))
          for e in r.get("errors", []):
              print("error:", e.get("code"), e.get("message"))
          PY
          fi

          echo "--- domain status now"
          api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/opencli-docs/domains" > /tmp/d.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/d.json"))
          for d in r.get("result") or []:
              print(f"domain={d['name']} status={d.get('status')}")
          PY

      - name: And whether it answers
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -m 25 -w '%{http_code}' -L https://docs.opencli.ai || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "not answering yet"
