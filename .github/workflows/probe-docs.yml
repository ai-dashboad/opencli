name: probe-docs
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Does docs.opencli.ai answer
        run: |
          echo "--- DNS"
          dig +short docs.opencli.ai | head -4
          echo "--- HTTP"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/page.html -m 25 -w '%{http_code}' -L https://docs.opencli.ai || echo 000)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              echo "--- title"
              grep -o '<title>[^<]*</title>' /tmp/page.html | head -1
              exit 0
            fi
            sleep 25
          done
          exit 1
