# Build and publish docs.opencli.ai.
#
# Separate from `website.yml` rather than merged into it, because the two are
# built by different tools and a break in one should not stop the other from
# publishing. They share the deployment shape deliberately: same credentials,
# same skip-when-unconfigured rule, so a fork builds the docs on every pull
# request and simply does not deploy them.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # `onBrokenLinks: "throw"` means this step fails on a link to a page
      # that does not exist. A dead link in documentation is worse than a
      # missing page: it looks like the answer exists and has been mislaid.
      - name: Build the docs
        run: pnpm --dir docs-site build

      # Idempotent: creating a project that exists returns an error naming it,
      # which is not a reason to fail the run. Doing it here rather than by
      # hand in a dashboard means the deployment can be reproduced from this
      # file alone — including on a fork, where nobody has the dashboard.
      - if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --dir docs-site exec wrangler pages project create opencli-docs \
            --production-branch=main 2>&1 | tee /tmp/create.log || \
            grep -qiE "already exists|8000007" /tmp/create.log

      - if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir docs-site exec wrangler pages deploy build --project-name=opencli-docs --branch=main

      # After the deploy, not before: if attaching the domain fails, the docs
      # are already live at `opencli-docs.pages.dev` and only the pretty name
      # is missing. Failing here is then a loud, accurate signal rather than a
      # lost deployment.
      #
      # Wrangler cannot do this — `pages project` has create, list and delete
      # and nothing else — so it is one API call. The zone is on the same
      # account, so Cloudflare adds the DNS record itself.
      - if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        name: Attach docs.opencli.ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/opencli-docs/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"docs.opencli.ai"}' > /tmp/domain.json
          python3 - <<'CHECK'
          import json, sys
          reply = json.load(open("/tmp/domain.json"))
          if reply.get("success"):
              print("attached docs.opencli.ai")
              sys.exit(0)
          errors = reply.get("errors", [])
          # Already attached is the ordinary state of every run after the first.
          if any("already" in str(e.get("message", "")).lower() for e in errors):
              print("docs.opencli.ai was already attached")
              sys.exit(0)
          # Anything else is worth stopping for — most likely the API token is
          # missing Pages:Edit, which no amount of retrying fixes.
          for e in errors:
              print(f"cloudflare: {e.get('code')} {e.get('message')}", file=sys.stderr)
          sys.exit(1)
          CHECK
