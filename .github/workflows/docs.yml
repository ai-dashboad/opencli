# Build and publish docs.opencli.ai.
#
# Separate from `website.yml` rather than merged into it, because the two are
# built by different tools and a break in one should not stop the other from
# publishing. They share the deployment shape deliberately: same credentials,
# same skip-when-unconfigured rule, so a fork builds the docs on every pull
# request and simply does not deploy them.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # `onBrokenLinks: "throw"` means this step fails on a link to a page
      # that does not exist. A dead link in documentation is worse than a
      # missing page: it looks like the answer exists and has been mislaid.
      - name: Build the docs
        run: pnpm --dir docs-site build

      # Idempotent: creating a project that exists returns an error naming it,
      # which is not a reason to fail the run. Doing it here rather than by
      # hand in a dashboard means the deployment can be reproduced from this
      # file alone — including on a fork, where nobody has the dashboard.
      - if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --dir docs-site exec wrangler pages project create opencli-docs \
            --production-branch=main 2>&1 | tee /tmp/create.log || \
            grep -qiE "already exists|8000007" /tmp/create.log

      - if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir docs-site exec wrangler pages deploy build --project-name=opencli-docs --branch=main

      # After the deploy, not before: if any of this fails, the docs are
      # already live at `opencli-docs.pages.dev` and only the pretty name is
      # missing. Failing here is then a loud, accurate signal rather than a
      # lost deployment.
      #
      # Two calls, because attaching a custom domain in the dashboard quietly
      # does two things and the API does only the first. Wrangler cannot do
      # either — `pages project` has create, list and delete and nothing else.
      #
      # Both are idempotent: after the first run they find their work already
      # done and say so.
      - if: ${{ github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        name: Attach docs.opencli.ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() {
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                     -H "Content-Type: application/json" "$@"
          }

          # 1. The DNS record. Without it the domain below stays at
          #    `verification=pending` for ever: attached to the project, with
          #    nothing pointing at it.
          api "https://api.cloudflare.com/client/v4/zones?name=opencli.ai" > /tmp/zone.json
          api "https://api.cloudflare.com/client/v4/zones/$(python3 -c "
          import json; z = json.load(open('/tmp/zone.json'))['result']
          print(z[0]['id'] if z else '')
          ")/dns_records?name=docs.opencli.ai" > /tmp/records.json
          python3 - <<'CHECK'
          import json
          records = json.load(open("/tmp/records.json")).get("result") or []
          open("/tmp/needs-record", "w").write("" if records else "yes")
          print("dns:", records[0]["content"] if records else "missing")
          CHECK

          if [ -s /tmp/needs-record ]; then
            zone=$(python3 -c "
          import json; z = json.load(open('/tmp/zone.json'))['result']
          print(z[0]['id'] if z else '')
          ")
            api -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" \
              --data '{"type":"CNAME","name":"docs","content":"opencli-docs.pages.dev","proxied":true}' \
              > /tmp/created.json
            python3 - <<'CHECK'
          import json, sys
          reply = json.load(open("/tmp/created.json"))
          if reply.get("success"):
              print("created CNAME docs -> opencli-docs.pages.dev")
              sys.exit(0)
          for e in reply.get("errors", []):
              print(f"cloudflare: {e.get('code')} {e.get('message')}", file=sys.stderr)
          # 10000 here means the token can read the zone and not write to it —
          # it needs Zone:DNS:Edit. Nothing retries its way out of that.
          sys.exit(1)
          CHECK
          fi

          # 2. The domain on the Pages project itself.
          api -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/opencli-docs/domains" \
            --data '{"name":"docs.opencli.ai"}' > /tmp/domain.json
          python3 - <<'CHECK'
          import json, sys
          reply = json.load(open("/tmp/domain.json"))
          if reply.get("success"):
              print("attached docs.opencli.ai")
              sys.exit(0)
          errors = reply.get("errors", [])
          # Already attached is the ordinary state of every run after the first.
          if any("already" in str(e.get("message", "")).lower() for e in errors):
              print("docs.opencli.ai was already attached")
              sys.exit(0)
          # Anything else is worth stopping for — most likely the API token is
          # missing Pages:Edit, which no amount of retrying fixes.
          for e in errors:
              print(f"cloudflare: {e.get('code')} {e.get('message')}", file=sys.stderr)
          sys.exit(1)
          CHECK
