name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # stage_npm_packages.py requires DotSlash when staging releases.
      - uses: facebook/install-dotslash@v2

      # Packaging for npm means downloading the binaries from a published
      # release, so there has to be one. The version used to be written here by
      # hand, which went stale the moment a release was cut and failed outright
      # in a repository that has never cut one.
      - name: Stage npm package
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -z "$tag" ]]; then
            echo "No release to package against yet; skipping."
            exit 0
          fi
          version="${tag#v}"
          output_dir="${RUNNER_TEMP}"
          python3 ./scripts/stage_npm_packages.py \
            --release-version "$version" \
            --package opencli \
            --output-dir "$output_dir"
          echo "pack_output=${output_dir}/opencli-npm-${version}.tgz" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.stage_npm_package.outputs.pack_output != '' }}
        name: Upload staged npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencli-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      # The web UI ships inside the desktop app and is served by `opencli
      # serve`, and until now nothing checked it on the way in.
      - name: Typecheck the web UI
        run: pnpm --dir web exec tsc --noEmit
      - name: Test the web UI
        run: pnpm --dir web exec vitest run
      - name: Typecheck the website
        run: pnpm --dir website exec tsc --noEmit

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      # `opencli-cli/README.md` is gitignored — it is written during npm
      # packaging, not kept in the repository — so these checked a file that
      # only exists on a machine that has published.
      - name: Ensure opencli-cli/README.md contains only ASCII and certain Unicode code points
        if: ${{ hashFiles('opencli-cli/README.md') != '' }}
        run: ./scripts/asciicheck.py opencli-cli/README.md
      - name: Check opencli-cli/README ToC
        if: ${{ hashFiles('opencli-cli/README.md') != '' }}
        run: python3 scripts/readme_toc.py opencli-cli/README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format
