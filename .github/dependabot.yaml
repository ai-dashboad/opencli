# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-
#
# Monthly rather than weekly, and capped. Left as it was inherited, the first
# day this repository was public produced a wall of pull requests against a
# dependency tree of several hundred crates — none of them read, all of them
# running the full CI matrix. A security update is worth interrupting for; a
# patch bump to a transitive crate is not.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - opencli-rs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the lot, so reviewing them is one job rather than
      # thirty.
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      javascript:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
