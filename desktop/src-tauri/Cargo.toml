[package]
name = "opencli-desktop"
version = "0.1.3"
edition = "2024"
description = "Desktop client for the OpenCLI agent."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
opencli-web-gateway = { path = "../../opencli-rs/web-gateway" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Updating in place. The signature the updater checks is minisign's, generated
# at release time from a key that has nothing to do with Apple or Microsoft code
# signing — so an unsigned build still updates itself safely.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"

# `opencli-core` needs the same forks the main workspace pins, and this crate is
# its own workspace so it does not inherit them. Its lock file is also seeded
# from the main one: resolved from scratch, shared transitive dependencies
# (hashbrown, starlark_map) pick newer versions that do not compile together.
[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", branch = "nornagon/color-query" }
ratatui = { git = "https://github.com/nornagon/ratatui", branch = "nornagon-v0.29.0-patch" }
tokio-tungstenite = { git = "https://github.com/JakkuSakura/tokio-tungstenite", rev = "2ae536b0de793f3ddf31fc2f22d445bf1ef2023d" }

# The desktop shell is a window and a gateway — no hot loop worth a
# whole-program optimisation. This crate is its own workspace root, so the main
# workspace's `lto = "fat"` does not reach it; thin LTO builds it in a fraction
# of the time and the agent itself, which is the part that has to be fast, is a
# separate binary built under the main profile.
[profile.release]
lto = "thin"
codegen-units = 16
