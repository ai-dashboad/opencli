[package]
name = "opencli-web-gateway"
version = { workspace = true }
edition = { workspace = true }

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
opencli-core = { workspace = true }
opencli-ssh = { workspace = true }
axum = { workspace = true, features = ["ws", "http1", "tokio", "json", "query"] }
# `StreamExt` lives behind the default features, which the workspace turns off.
futures = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "stream"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
