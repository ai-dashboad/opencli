[workspace.package]
# OpenCLI's own version line, not the one inherited from the project this was
# forked from. Everything shipped in a release carries this number: the CLI, the
# desktop app and the site's download links. `scripts/set-version.sh` moves them
# together, because the updater compares versions and two halves of a release
# disagreeing about which one it is would be silent.
version = "0.1.6"
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "Apache-2.0"

